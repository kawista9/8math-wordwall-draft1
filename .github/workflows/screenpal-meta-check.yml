name: ScreenPal metadata check

on:
  push:
    paths:
      - ".github/workflows/screenpal-meta-check.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ScreenPal metadata
        shell: bash
        run: |
          python - <<'PY'
          import requests, re, html, json
          ids = [
            "cOewrnnTaAP","cOewrQnTaBR","cOewr3nTakp","cOewrgnTaCG",
            "cOewhonTxsX","cOfVnZnTzQX","cOfVnMnTzI1","cOfVeFnTzDX",
            "cOew36nTaGS","cOfVeMnTzqP","cOewr9nTaE7","cOew14nTxWx"
          ]
          headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"}
          pats = [
            ("og:title", r'<meta[^>]+property=["\']og:title["\'][^>]+content=["\']([^"\']+)'),
            ("twitter:title", r'<meta[^>]+name=["\']twitter:title["\'][^>]+content=["\']([^"\']+)'),
            ("title", r'<title[^>]*>(.*?)</title>'),
            ("og:description", r'<meta[^>]+property=["\']og:description["\'][^>]+content=["\']([^"\']+)'),
            ("description", r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']+)'),
          ]
          for vid in ids:
            print("\n===== ID", vid, "=====")
            for kind,url in [
              ("watch",f"https://go.screenpal.com/watch/{vid}"),
              ("player",f"https://go.screenpal.com/player/{vid}"),
              ("appearance",f"https://go.screenpal.com/player/appearance/{vid}")
            ]:
              try:
                r=requests.get(url,headers=headers,timeout=30,allow_redirects=True)
                print(kind, r.status_code, r.url, "len", len(r.text), "ctype", r.headers.get("content-type"))
                txt=r.text
                for label,pat in pats:
                  m=re.search(pat,txt,re.I|re.S)
                  if m:
                    v=re.sub(r'\s+',' ',html.unescape(m.group(1))).strip()
                    print(" ",label,":",v[:500])
                # Search likely embedded JSON/content terms.
                for key in ["videoTitle","title","description","summary","name"]:
                  for m in re.finditer(r'["\']'+re.escape(key)+r'["\']\s*:\s*["\']([^"\']{3,300})', txt, re.I):
                    val=html.unescape(m.group(1))
                    if "screenpal" not in val.lower():
                      print(" ",key,":",val[:300])
                      break
              except Exception as e:
                print(kind,"ERROR",repr(e))
          PY
